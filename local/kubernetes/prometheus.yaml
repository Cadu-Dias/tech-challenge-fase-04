global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.observability.svc.cluster.local:8889"]
  - job_name: auth-metrics
    static_configs:
      - targets: ["otel-collector.observability.svc.cluster.local:8890"]
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics-local.toggle.svc.cluster.local:8080"]
  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /etc/kubelet/kubelet.crt
      server_name: toggle-observability-control-plane
    static_configs:
      - targets: ["NODE_ADDRESS_PLACEHOLDER:10250"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "container_cpu_usage_seconds_total|container_memory_working_set_bytes"
        action: keep
      - source_labels: [namespace]
        regex: toggle
        action: keep
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
