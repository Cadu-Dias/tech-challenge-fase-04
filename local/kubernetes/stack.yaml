apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: toggle}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: togglemaster}
            - {name: POSTGRES_PASSWORD, value: local-only-password}
            - {name: LOCAL_SERVICE_API_KEY, value: local-service-key}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, togglemaster, -d, targeting_db]}
            periodSeconds: 5
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: schemas, mountPath: /schemas, readOnly: true}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 365}
        - name: schemas
          configMap: {name: postgres-schemas}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: toggle}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: toggle}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: toggle}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: localstack, namespace: toggle}
spec:
  replicas: 1
  selector: {matchLabels: {app: localstack}}
  template:
    metadata: {labels: {app: localstack}}
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8
          env:
            - {name: SERVICES, value: "sqs,dynamodb"}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          ports: [{containerPort: 4566}]
          readinessProbe:
            exec: {command: [sh, -c, "awslocal dynamodb describe-table --table-name ToggleMasterAnalytics >/dev/null"]}
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - {name: init, mountPath: /etc/localstack/init/ready.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: localstack-init, defaultMode: 365}
---
apiVersion: v1
kind: Service
metadata: {name: localstack, namespace: toggle}
spec:
  selector: {app: localstack}
  ports: [{port: 4566}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: [--config=/etc/collector/config.yaml]
          ports: [{containerPort: 4317}, {containerPort: 4318}, {containerPort: 8889}]
          volumeMounts:
            - {name: config, mountPath: /etc/collector, readOnly: true}
            - {name: telemetry-auth, mountPath: /var/run/telemetry, readOnly: true}
            - {name: auth-metrics, mountPath: /var/run/auth-metrics, readOnly: true}
      volumes:
        - {name: config, configMap: {name: collector-config}}
        - name: telemetry-auth
          secret:
            secretName: telemetry-gateway-auth
            items:
              - {key: token, path: token}
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        - {name: auth-metrics, secret: {secretName: auth-metrics-gateway}}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: observability}
spec:
  selector: {app: otel-collector}
  ports:
    - {name: grpc, port: 4317}
    - {name: http, port: 4318}
    - {name: metrics, port: 8889}
    - {name: auth-otlp, port: 4319}
    - {name: auth-metrics, port: 8890}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: otel-log-agent, namespace: observability}
spec:
  selector: {matchLabels: {app: otel-log-agent}}
  template:
    metadata: {labels: {app: otel-log-agent}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: [--config=/etc/agent/agent.yaml]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/agent, readOnly: true}
            - {name: logs, mountPath: /var/log/pods, readOnly: true}
            - {name: telemetry-auth, mountPath: /var/run/telemetry, readOnly: true}
      volumes:
        - {name: config, configMap: {name: agent-config}}
        - {name: logs, hostPath: {path: /var/log/pods, type: Directory}}
        - {name: telemetry-auth, secret: {secretName: telemetry-agent-auth}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: toggle}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus-local
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: kubelet-cert, mountPath: /etc/kubelet, readOnly: true}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: kubelet-cert, configMap: {name: kubelet-serving-cert}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: toggle}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: toggle}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          args: [-config.file=/etc/loki/local-config.yaml]
          ports: [{containerPort: 3100}]
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: toggle}
spec:
  selector: {app: loki}
  ports: [{port: 3100}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: toggle}
spec:
  replicas: 1
  selector: {matchLabels: {app: tempo}}
  template:
    metadata: {labels: {app: tempo}}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: [-config.file=/etc/tempo/tempo.yaml]
          ports: [{containerPort: 3200}, {containerPort: 4317}]
          volumeMounts: [{name: config, mountPath: /etc/tempo, readOnly: true}]
      volumes: [{name: config, configMap: {name: tempo-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: tempo, namespace: toggle}
spec:
  selector: {app: tempo}
  ports: [{name: http, port: 3200}, {name: grpc, port: 4317}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana, app.kubernetes.io/name: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/var/run/self-healing-ca"}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: grafana-admin, key: username}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
            - name: PAGERDUTY_INTEGRATION_KEY
              valueFrom: {secretKeyRef: {name: notification-credentials, key: pagerduty-key, optional: true}}
            - name: TEAMS_WEBHOOK_URL
              valueFrom: {secretKeyRef: {name: notification-credentials, key: teams-webhook, optional: true}}
            - name: DISCORD_WEBHOOK_URL
              valueFrom: {secretKeyRef: {name: discord-webhook, key: url, optional: true}}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: telegram-alerts, key: bot-token, optional: true}}
            - name: TELEGRAM_CHAT_ID
              valueFrom: {secretKeyRef: {name: telegram-alerts, key: chat-id, optional: true}}
            - name: SELF_HEALING_TOKEN
              valueFrom: {secretKeyRef: {name: self-healing-client, key: token, optional: true}}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: alerts, mountPath: /etc/grafana/provisioning/alerting, readOnly: true}
            - {name: self-healing-ca, mountPath: /var/run/self-healing-ca, readOnly: true}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: providers, configMap: {name: grafana-providers}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
        - {name: alerts, configMap: {name: grafana-alerts}}
        - name: self-healing-ca
          secret:
            secretName: self-healing-client
            optional: true
            items: [{key: tls.crt, path: tls.crt}]
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: observability}
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
