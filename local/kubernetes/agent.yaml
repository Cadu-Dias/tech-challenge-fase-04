receivers:
  filelog:
    include: [/var/log/pods/*/*/*.log]
    exclude: [/var/log/pods/observability_otel-log-agent-*/*/*.log]
    include_file_path: true
    start_at: beginning
    operators:
      - type: container
        on_error: drop_quiet
extensions:
  bearertokenauth:
    filename: /var/run/telemetry/token
processors:
  transform/parse:
    error_mode: silent
    log_statements:
      - set(log.body, ParseJSON(log.body)) where IsString(log.body)
  filter/events:
    error_mode: propagate
    logs:
      log_record:
        - not IsMap(log.body)
        - log.body["event"] != "http.request" and log.body["event"] != "sqs.process"
  transform/allowlist:
    error_mode: propagate
    log_statements:
      - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"])
      - keep_keys(resource.attributes, ["service.name", "k8s.namespace.name", "k8s.pod.name", "k8s.container.name"])
      - keep_keys(log.body, ["event", "route", "method", "status", "outcome", "trace_id", "span_id"])
      - delete_key(log.body, "route") where not IsString(log.body["route"])
      - 'delete_key(log.body, "route") where IsString(log.body["route"]) and log.body["route"] != "/validate" and log.body["route"] != "/admin/keys" and log.body["route"] != "/evaluate" and log.body["route"] != "/flags" and log.body["route"] != "/flags/<string:name>" and log.body["route"] != "/rules" and log.body["route"] != "/rules/<string:flag_name>" and log.body["route"] != "unmatched"'
      - delete_key(log.body, "method") where not IsString(log.body["method"])
      - 'delete_key(log.body, "method") where IsString(log.body["method"]) and log.body["method"] != "GET" and log.body["method"] != "HEAD" and log.body["method"] != "POST" and log.body["method"] != "PUT" and log.body["method"] != "PATCH" and log.body["method"] != "DELETE" and log.body["method"] != "OPTIONS" and log.body["method"] != "_OTHER"'
      - 'set(log.body["status"], Int(log.body["status"])) where IsDouble(log.body["status"]) and log.body["status"] >= 100 and log.body["status"] <= 599 and log.body["status"] == Double(Int(log.body["status"]))'
      - delete_key(log.body, "status") where not IsInt(log.body["status"])
      - 'delete_key(log.body, "status") where IsInt(log.body["status"]) and (log.body["status"] < 100 or log.body["status"] > 599)'
      - delete_key(log.body, "outcome") where not IsString(log.body["outcome"])
      - 'delete_key(log.body, "outcome") where IsString(log.body["outcome"]) and log.body["outcome"] != "success" and log.body["outcome"] != "error"'
      - delete_key(log.body, "trace_id") where not IsString(log.body["trace_id"])
      - 'delete_key(log.body, "trace_id") where IsString(log.body["trace_id"]) and not IsMatch(log.body["trace_id"], "^[0-9a-f]{32}$")'
      - delete_key(log.body, "span_id") where not IsString(log.body["span_id"])
      - 'delete_key(log.body, "span_id") where IsString(log.body["span_id"]) and not IsMatch(log.body["span_id"], "^[0-9a-f]{16}$")'
      - 'delete_key(log.body, "trace_id") where resource.attributes["k8s.namespace.name"] != "toggle" or (resource.attributes["k8s.container.name"] != "auth-service" and resource.attributes["k8s.container.name"] != "flag-service" and resource.attributes["k8s.container.name"] != "targeting-service" and resource.attributes["k8s.container.name"] != "evaluation-service" and resource.attributes["k8s.container.name"] != "analytics-service")'
      - 'delete_key(log.body, "span_id") where resource.attributes["k8s.namespace.name"] != "toggle" or (resource.attributes["k8s.container.name"] != "auth-service" and resource.attributes["k8s.container.name"] != "flag-service" and resource.attributes["k8s.container.name"] != "targeting-service" and resource.attributes["k8s.container.name"] != "evaluation-service" and resource.attributes["k8s.container.name"] != "analytics-service")'
      - keep_keys(log.attributes, [])
  batch: {}
exporters:
  otlp:
    endpoint: otel-collector.observability.svc.cluster.local:4317
    tls:
      ca_file: /var/run/telemetry/tls.crt
    auth:
      authenticator: bearertokenauth
service:
  extensions: [bearertokenauth]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [transform/parse, filter/events, transform/allowlist, batch]
      exporters: [otlp]
