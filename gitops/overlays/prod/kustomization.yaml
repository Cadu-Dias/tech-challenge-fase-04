apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: toggle

resources:
- ../../base/namespace
- ../../base/auth-service
- ../../base/flag-service
- ../../base/targeting-service
- ../../base/evaluation-service
