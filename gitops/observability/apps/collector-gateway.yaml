apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-collector-gateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.175.1
      helm:
        releaseName: collector-gateway
        valueFiles: [$values/gitops/observability/helm/collector-gateway.yaml]
    - repoURL: https://github.com/Cadu-Dias/tech-challenge-fase-04.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions: [CreateNamespace=true]
