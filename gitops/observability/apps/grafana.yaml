apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-observability-grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cadu-Dias/tech-challenge-fase-04.git
    targetRevision: main
    path: gitops/observability/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions: [CreateNamespace=true]
