apiVersion: 1
groups:
  - orgId: 1
    name: togglemaster-http
    folder: ToggleMaster
    interval: 30s
    rules:
      - uid: togglemaster-http-5xx
        title: Taxa elevada de erros 5xx nos serviços HTTP
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Serviço HTTP acima de 5% de erros 5xx em 2 minutos, com pelo menos 20 requisições.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                ((sum by (service_name) (increase(http_server_request_duration_seconds_count{service_name=~"flag-service|targeting-service|evaluation-service",http_response_status_code=~"5.."}[2m]))
                or 0 * sum by (service_name) (increase(http_server_request_duration_seconds_count{service_name=~"flag-service|targeting-service|evaluation-service"}[2m])))
                / clamp_min(sum by (service_name) (increase(http_server_request_duration_seconds_count{service_name=~"flag-service|targeting-service|evaluation-service"}[2m])), 1))
                * (sum by (service_name) (increase(http_server_request_duration_seconds_count{service_name=~"flag-service|targeting-service|evaluation-service"}[2m])) >= bool 20)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
              datasource: {type: __expr__, uid: __expr__}
      - uid: togglemaster-http-latency
        title: Latência elevada nos serviços HTTP
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Mais de 5% das requisições demoraram mais de 1 segundo em 2 minutos, com pelo menos 20 requisições.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                ((sum by (service_name) (increase(http_server_request_duration_seconds_count{service_name=~"auth-service|flag-service|targeting-service|evaluation-service"}[2m]))
                - sum by (service_name) (increase(http_server_request_duration_seconds_bucket{service_name=~"auth-service|flag-service|targeting-service|evaluation-service",le="1"}[2m])))
                / clamp_min(sum by (service_name) (increase(http_server_request_duration_seconds_count{service_name=~"auth-service|flag-service|targeting-service|evaluation-service"}[2m])), 1))
                * (sum by (service_name) (increase(http_server_request_duration_seconds_count{service_name=~"auth-service|flag-service|targeting-service|evaluation-service"}[2m])) >= bool 20)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
              datasource: {type: __expr__, uid: __expr__}
