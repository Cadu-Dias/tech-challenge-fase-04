apiVersion: 1
groups:
  - orgId: 1
    name: togglemaster-auth
    folder: ToggleMaster
    interval: 30s
    rules:
      - uid: togglemaster-auth-5xx
        title: Auth com taxa elevada de erros 5xx
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          service: auth-service
          severity: critical
        annotations:
          summary: Auth acima de 5% de erros 5xx por dois minutos, com pelo menos 20 requisições.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                ((sum(increase(http_server_request_duration_seconds_count{service_name="auth-service",http_response_status_code=~"5.."}[2m])) or vector(0))
                / clamp_min(sum(increase(http_server_request_duration_seconds_count{service_name="auth-service"}[2m])), 1))
                * (sum(increase(http_server_request_duration_seconds_count{service_name="auth-service"}[2m])) >= bool 20)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
              datasource: {type: __expr__, uid: __expr__}
