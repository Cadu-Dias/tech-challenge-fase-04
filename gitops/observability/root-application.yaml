apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cadu-Dias/tech-challenge-fase-04.git
    targetRevision: main
    path: gitops/observability/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
