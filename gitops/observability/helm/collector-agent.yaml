mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.161.0
command:
  name: otelcol-contrib
serviceAccount:
  automountServiceAccountToken: false
securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: false
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {cpu: 250m, memory: 256Mi}
ports:
  otlp: {enabled: false}
  otlp-http: {enabled: false}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
config:
  receivers:
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null
    file_log:
      include: [/var/log/pods/toggle_*/*/*.log]
  processors:
    transform/parse:
      error_mode: ignore
      log_statements:
        - set(log.body, ParseJSON(log.body)) where IsString(log.body)
    filter/events:
      error_mode: ignore
      logs:
        log_record:
          - not IsMap(log.body)
          - log.body["event"] != "http.request" and log.body["event"] != "sqs.process"
    transform/allowlist:
      error_mode: propagate
      log_statements:
        - keep_keys(log.body, ["event", "service", "route", "method", "status", "outcome", "trace_id", "span_id"])
  exporters:
    debug: null
    otlp/gateway:
      endpoint: collector-gateway-opentelemetry-collector.observability.svc.cluster.local:4317
      tls: {insecure: true}
      sending_queue: {enabled: true, queue_size: 256}
      retry_on_failure: {enabled: true, max_elapsed_time: 30s}
  service:
    pipelines:
      traces: null
      metrics: null
      logs:
        receivers: []
        processors: [memory_limiter, transform/parse, filter/events, transform/allowlist, batch]
        exporters: [otlp/gateway]
