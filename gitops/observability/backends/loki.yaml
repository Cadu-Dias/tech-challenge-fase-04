apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  config.yaml: |
    auth_enabled: false
    analytics:
      reporting_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2020-10-24"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 24h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          args: [-config.file=/etc/loki/config.yaml]
          ports:
            - {name: http, containerPort: 3100}
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi}
            limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 2Gi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {sizeLimit: 1500Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
